  <path
    d="M32 14 H20 A6 6 0 0 0 20 26 H28 A6 6 0 0 1 28 38 H16"
    fill="none"
    stroke="#2FD98A"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  </g>
</svg>
