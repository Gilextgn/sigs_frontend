  sur photo sombre et en vidéo. Pour une version d'une seule couleur (gravure,
  tampon, impression monochrome), remplacer le stroke par #FFFFFF ou #0E1117.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 48 48" role="img" aria-label="SIGS">
