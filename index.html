<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/branding/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/images/branding/favicon-64.png" />
    <link rel="apple-touch-icon" href="/images/branding/logo-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGS Admin</title>
    <meta name="description" content="Gestion scolaire : élèves, classes, paiements, débiteurs." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        // Clair par défaut : on ne bascule en sombre que si l'utilisateur
        // l'a explicitement choisi lors d'une visite précédente.
        if (localStorage.getItem('schoolflow:theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Styles du splash en ligne : le CSS du bundle n'est pas encore chargé
         au premier paint, c'est précisément ce que cet écran doit couvrir. -->
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6f8;
        color: #10151c;
      }
      html.dark #initial-loader { background: #0e1117; color: #e7eaf0; }
      #initial-loader .ring { position: relative; width: 72px; height: 72px; }
      #initial-loader .ring svg { position: absolute; inset: 0; }
      #initial-loader .track { stroke: #eaedf1; }
      #initial-loader .arc { stroke: #0e9f6e; }
      html.dark #initial-loader .track { stroke: #1c212b; }
      html.dark #initial-loader .arc { stroke: #2fd98a; }
      #initial-loader .spin { animation: initial-loader-spin 0.9s linear infinite; }
      #initial-loader .mark { display: grid; place-items: center; }
      @keyframes initial-loader-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader .spin { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <!-- Placé dans #root : React remplace le contenu du conteneur au premier
         rendu, le splash disparaît donc sans code de nettoyage. -->
    <div id="root">
      <div id="initial-loader" role="status" aria-label="Chargement de SIGS">
        <div class="ring">
          <svg class="spin" width="72" height="72" viewBox="0 0 72 72">
            <circle class="track" cx="36" cy="36" r="31" fill="none" stroke-width="5" />
            <circle class="arc" cx="36" cy="36" r="31" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="60 135" />
          </svg>
          <svg class="mark" width="72" height="72" viewBox="-30 -30 108 108">
            <path d="M32 14 H20 A6 6 0 0 0 20 26 H28 A6 6 0 0 1 28 38 H16" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
